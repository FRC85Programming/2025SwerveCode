<!DOCTYPE html>
<html>
<head>
    <title>Simple Web Server</title>
    <script>
        async function toggleValue() {
            const response = await fetch('/toggle', { method: 'POST' });
            const result = await response.text();
            alert(result);
        }
    </script>
</head>
<body>
    <h1>Simple NetworkTables Toggle</h1>
    <button onclick="toggleValue()">Toggle Boolean</button>
</body>
</html>
