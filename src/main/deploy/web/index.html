<!DOCTYPE html>
<html>
<head>
    <title>Reef Position Selector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-button active" onclick="showContainer('reefcontainer')">Teleop</button>
        <button class="tab-button" onclick="showContainer('autocontainer')">Auto</button>
    </div>

    <div class="container reefcontainer active">
        <img class="reef" id="reef" src="images/reefs/reef-red.jpg" alt="Reef Image">
        
        <img class="button positionA" data-value="positionA" src="images/coral/coral-a.jpg" onclick="sendReefPosition('positionA')" alt="Coral A">
        <img class="button positionB" data-value="positionB" src="images/coral/coral-b.jpg" onclick="sendReefPosition('positionB')" alt="Coral B">
        <img class="button positionC" data-value="positionC" src="images/coral/coral-c.jpg" onclick="sendReefPosition('positionC')" alt="Coral C">
        <img class="button positionD" data-value="positionD" src="images/coral/coral-d.jpg" onclick="sendReefPosition('positionD')" alt="Coral D">
        <img class="button positionE" data-value="positionE" src="images/coral/coral-e.jpg" onclick="sendReefPosition('positionE')" alt="Coral E">
        <img class="button positionF" data-value="positionF" src="images/coral/coral-f.jpg" onclick="sendReefPosition('positionF')" alt="Coral F">
        <img class="button positionG" data-value="positionG" src="images/coral/coral-g.jpg" onclick="sendReefPosition('positionG')" alt="Coral G">
        <img class="button positionH" data-value="positionH" src="images/coral/coral-h.jpg" onclick="sendReefPosition('positionH')" alt="Coral H">
        <img class="button positionI" data-value="positionI" src="images/coral/coral-i.jpg" onclick="sendReefPosition('positionI')" alt="Coral I">
        <img class="button positionJ" data-value="positionJ" src="images/coral/coral-j.jpg" onclick="sendReefPosition('positionJ')" alt="Coral J">
        <img class="button positionK" data-value="positionK" src="images/coral/coral-k.jpg" onclick="sendReefPosition('positionK')" alt="Coral K">
        <img class="button positionL" data-value="positionL" src="images/coral/coral-l.jpg" onclick="sendReefPosition('positionL')" alt="Coral L">
        <img class="source" src="images/source/source.jpg" alt="Source Image">
        <img class="button positionSA" data-value="positionSA" src="images/coral/coral-blank.jpg" onclick="sendSourcePosition('positionSA')" alt="Source A">
        <img class="button positionSB" data-value="positionSB" src="images/coral/coral-blank.jpg" onclick="sendSourcePosition('positionSB')" alt="Source B">
    </div>
    
    <div class="container autocontainer">  
        <img class="autoReef" id="autoReef" src="images/reefs/reef-red.jpg" alt="Reef Image">
            
        <img class="button autoPositionA" data-value="positionA" src="images/coral/coral-a.jpg" onclick="selectAutoPosition('positionA')" alt="Coral A">
        <img class="button autoPositionB" data-value="positionB" src="images/coral/coral-b.jpg" onclick="selectAutoPosition('positionB')" alt="Coral B">
        <img class="button autoPositionC" data-value="positionC" src="images/coral/coral-c.jpg" onclick="selectAutoPosition('positionC')" alt="Coral C">
        <img class="button autoPositionD" data-value="positionD" src="images/coral/coral-d.jpg" onclick="selectAutoPosition('positionD')" alt="Coral D">
        <img class="button autoPositionE" data-value="positionE" src="images/coral/coral-e.jpg" onclick="selectAutoPosition('positionE')" alt="Coral E">

        <img class="button autoPositionG" data-value="positionG" src="images/coral/coral-g.jpg" onclick="selectAutoPosition('positionG')" alt="Coral G">
        <img class="button autoPositionH" data-value="positionH" src="images/coral/coral-h.jpg" onclick="selectAutoPosition('positionH')" alt="Coral H">
        <img class="button autoPositionI" data-value="positionI" src="images/coral/coral-i.jpg" onclick="selectAutoPosition('positionI')" alt="Coral I">
        <img class="button autoPositionJ" data-value="positionJ" src="images/coral/coral-j.jpg" onclick="selectAutoPosition('positionJ')" alt="Coral J">
        <img class="button autoPositionK" data-value="positionK" src="images/coral/coral-k.jpg" onclick="selectAutoPosition('positionK')" alt="Coral K">
        <img class="button autoPositionL" data-value="positionL" src="images/coral/coral-l.jpg" onclick="selectAutoPosition('positionL')" alt="Coral L">-->
        <button class="updateselectionbutton" onclick="updateAutoSelection()">Update Selections</button>
    </div>

    <img class="logo" src="images/logos/logo-bob.jpg" alt="Logo">

    <script src="networktables.js"></script>
    <script src="tabmanager.js"></script>
</body>
</html>
