<!DOCTYPE html>
<html>
<head>
    <title>Reef Position Selector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #121318;
        }

        .reef {
            display: block;
            width: 350px;  
        }

        .source {
            display: block;
            width: 150px;  
            height: 450px;
        }

        .logo {
            position: absolute;
            right: 0px;
            bottom: 0px;
            height: 80px;
            width: 80px;
        }

        .container {
            position: relative;
            display: inline-block;
            text-align: center;
        }

        .reefcontainer {
            top: -10px;
            left: 800px;
            transform: rotate(-90deg);
        }

        .sourcecontainer {
            top: -90px;
            left: -80px;
            transform: rotate(-90deg);
        }

        .container img {
            display: block;
        }

        .button {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
            cursor: pointer;
        }

        .button:hover {
            filter: brightness(0.7);
        }

        .selected {
            border: 4px solid #ff5722;
            filter: brightness(0.5);
        }

        /* Button positions */
        .positionA { top: 35%; left: -60px; transform: translateY(-50%); }
        .positionB { top: 65%; left: -60px; transform: translateY(-50%); }
        .positionC { bottom: -15px; left: 5%; transform: translateX(-50%); }
        .positionD { bottom: -60px; left: 30%; transform: translateX(-50%); }
        .positionE { bottom: -60px; right: 30%; transform: translateX(50%); }
        .positionF { bottom: -15px; right: 5%; transform: translateX(50%); }
        .positionG { top: 65%; right: -60px; transform: translateY(-50%); }
        .positionH { top: 35%; right: -60px; transform: translateY(-50%); }
        .positionI { top: -60px; right: 30%; transform: translateX(50%); }
        .positionJ { top: -15px; right: 5%; transform: translateX(50%); }
        .positionK { top: -15px; left: 5%; transform: translateX(-50%); }
        .positionL { top: -60px; left: 30%; transform: translateX(-50%); }
        .positionSA { top: 70px; left: 50%; transform: translateX(-50%); }
        .positionSB { top: 310px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>
    <div class="container reefcontainer">
        <img class="reef" src="images/reef.jpg" alt="Reef Image">
        <img class="button positionA" src="images/coral.jpg" onclick="updateNetworkTables('positionA', 'reef')" alt="Coral A">
        <img class="button positionB" src="images/coral.jpg" onclick="updateNetworkTables('positionB', 'reef')" alt="Coral B">
        <img class="button positionC" src="images/coral.jpg" onclick="updateNetworkTables('positionC', 'reef')" alt="Coral C">
        <img class="button positionD" src="images/coral.jpg" onclick="updateNetworkTables('positionD', 'reef')" alt="Coral D">
        <img class="button positionE" src="images/coral.jpg" onclick="updateNetworkTables('positionE', 'reef')" alt="Coral E">
        <img class="button positionF" src="images/coral.jpg" onclick="updateNetworkTables('positionF', 'reef')" alt="Coral F">
        <img class="button positionG" src="images/coral.jpg" onclick="updateNetworkTables('positionG', 'reef')" alt="Coral G">
        <img class="button positionH" src="images/coral.jpg" onclick="updateNetworkTables('positionH', 'reef')" alt="Coral H">
        <img class="button positionI" src="images/coral.jpg" onclick="updateNetworkTables('positionI', 'reef')" alt="Coral I">
        <img class="button positionJ" src="images/coral.jpg" onclick="updateNetworkTables('positionJ', 'reef')" alt="Coral J">
        <img class="button positionK" src="images/coral.jpg" onclick="updateNetworkTables('positionK', 'reef')" alt="Coral K">
        <img class="button positionL" src="images/coral.jpg" onclick="updateNetworkTables('positionL', 'reef')" alt="Coral L">
    </div>
    
    <div class="container sourcecontainer">
        <img class="source" src="images/source.jpg" alt="Source Image">
        <img class="button positionSA" src="images/coral.jpg" onclick="updateNetworkTables('positionSA', 'source')" alt="Source A">
        <img class="button positionSB" src="images/coral.jpg" onclick="updateNetworkTables('positionSB', 'source')" alt="Source B">
    </div>

    <img class="logo" src="images/boblogo.jpg" alt="Logo">


    <script>
        function updateNetworkTables(valueToPost, group) {
            const buttons = document.querySelectorAll(`.${group}container .button`);
            buttons.forEach(button => button.classList.remove("selected"));

            const clickedButton = document.querySelector(`img[onclick*="${valueToPost}"]`);
            if (clickedButton) {
                clickedButton.classList.add("selected");
            }

            const variable = group === "reef" ? "reefPositionValue" : "sourcePositionValue";

            fetch("/toggle", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ variable: variable, value: valueToPost })
            })
            .then(response => {
                if (response.ok) {
                    console.log(`NetworkTables ${variable} updated to ${valueToPost}!`);
                } else {
                    console.error("Failed to update NetworkTables value.");
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
