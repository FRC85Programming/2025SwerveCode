<!DOCTYPE html>
<html>
<head>
    <title>Reef Position Selector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-button active" onclick="showContainer('reefcontainer')">Teleop</button>
        <button class="tab-button" onclick="showContainer('autocontainer')">Auto</button>
    </div>

    <div class="container reefcontainer active">
        <img class="reef" id="reef" src="images/reefs/reef-red.jpg" alt="Reef Image">
        
        <img class="button positionA" data-value="A" src="images/coral/coral-a.jpg" onclick="sendReefPosition('A')" alt="Coral A">
        <img class="button positionB" data-value="B" src="images/coral/coral-b.jpg" onclick="sendReefPosition('B')" alt="Coral B">
        <img class="button positionC" data-value="C" src="images/coral/coral-c.jpg" onclick="sendReefPosition('C')" alt="Coral C">
        <img class="button positionD" data-value="D" src="images/coral/coral-d.jpg" onclick="sendReefPosition('D')" alt="Coral D">
        <img class="button positionE" data-value="E" src="images/coral/coral-e.jpg" onclick="sendReefPosition('E')" alt="Coral E">
        <img class="button positionF" data-value="F" src="images/coral/coral-f.jpg" onclick="sendReefPosition('F')" alt="Coral F">
        <img class="button positionG" data-value="G" src="images/coral/coral-g.jpg" onclick="sendReefPosition('G')" alt="Coral G">
        <img class="button positionH" data-value="H" src="images/coral/coral-h.jpg" onclick="sendReefPosition('H')" alt="Coral H">
        <img class="button positionI" data-value="I" src="images/coral/coral-i.jpg" onclick="sendReefPosition('I')" alt="Coral I">
        <img class="button positionJ" data-value="J" src="images/coral/coral-j.jpg" onclick="sendReefPosition('J')" alt="Coral J">
        <img class="button positionK" data-value="K" src="images/coral/coral-k.jpg" onclick="sendReefPosition('K')" alt="Coral K">
        <img class="button positionL" data-value="L" src="images/coral/coral-l.jpg" onclick="sendReefPosition('L')" alt="Coral L">
    </div>
    
    <div class="container autocontainer">  
        <img class="autoReef" id="autoReef" src="images/reefs/reef-red.jpg" alt="Reef Image">
            
        <img class="button autoPositionA" data-value="A" src="images/coral/coral-a.jpg" onclick="selectAutoPosition('A')" alt="Coral A">
        <img class="button autoPositionB" data-value="B" src="images/coral/coral-b.jpg" onclick="selectAutoPosition('B')" alt="Coral B">
        <img class="button autoPositionC" data-value="C" src="images/coral/coral-c.jpg" onclick="selectAutoPosition('C')" alt="Coral C">
        <img class="button autoPositionD" data-value="D" src="images/coral/coral-d.jpg" onclick="selectAutoPosition('D')" alt="Coral D">
        <img class="button autoPositionE" data-value="E" src="images/coral/coral-e.jpg" onclick="selectAutoPosition('E')" alt="Coral E">
        <img class="button autoPositionF" data-value="F" src="images/coral/coral-f.jpg" onclick="selectAutoPosition('F')" alt="Coral F">
        <img class="button autoPositionG" data-value="G" src="images/coral/coral-g.jpg" onclick="selectAutoPosition('G')" alt="Coral G">
        <img class="button autoPositionH" data-value="H" src="images/coral/coral-h.jpg" onclick="selectAutoPosition('H')" alt="Coral H">
        <img class="button autoPositionI" data-value="I" src="images/coral/coral-i.jpg" onclick="selectAutoPosition('I')" alt="Coral I">
        <img class="button autoPositionJ" data-value="J" src="images/coral/coral-j.jpg" onclick="selectAutoPosition('J')" alt="Coral J">
        <img class="button autoPositionK" data-value="K" src="images/coral/coral-k.jpg" onclick="selectAutoPosition('K')" alt="Coral K">
        <img class="button autoPositionL" data-value="L" src="images/coral/coral-l.jpg" onclick="selectAutoPosition('L')" alt="Coral L">
        <button class="updateselectionbutton" onclick="updateAutoSelection()">Update Selections</button>
        <button class="resetautoselectionsbutton" onclick="clearAutoSelections()">Reset Selections</button>
    </div>

    <img class="logo" src="images/logos/logo-bob.jpg" alt="Logo">

    <script src="networktables.js"></script>
    <script src="tabmanager.js"></script>
</body>
</html>
