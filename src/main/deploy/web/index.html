<!DOCTYPE html>
<html>
<head>
    <title>Reef Position Selector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #121318;
        }

        .reefcontainer {
            position: relative; 
            display: inline-block; 
            top: -20px; 
            left: 800px;
            margin: 100px auto; 
            text-align: center;
        }

        .sourcecontainer {
            position: relative; 
            display: inline-block; 
            top: -150px; 
            left: -100px;
            margin: 100px auto; 
            text-align: center;
            transform: rotate(-90deg);
        }

        .reef {
            display: block;
            width: 300px;  
        }
        .source {
            display: block;
            width: 150px;  
            height: 300px;
        }

        .positionAButton {
            top: 35%; 
            left: -60px; 
            transform: translateY(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionBButton {
            top: 65%; 
            left: -60px; 
            transform: translateY(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionCButton {
            bottom: -15px;
            left: 5%; 
            transform: translateX(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionDButton {
            bottom: -60px;
            left: 30%; 
            transform: translateX(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionEButton {
            bottom: -60px;
            right: 30%; 
            transform: translateX(50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionFButton {
            bottom: -15px;
            right: 5%; 
            transform: translateX(50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionGButton {
            top: 65%; 
            right: -60px; 
            transform: translateY(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionHButton {
            top: 35%; 
            right: -60px; 
            transform: translateY(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionIButton {
            top: -60px;
            right: 30%; 
            transform: translateX(50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionJButton {
            top: -15px;
            right: 5%; 
            transform: translateX(50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionKButton {
            top: -15px;
            left: 5%; 
            transform: translateX(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 2px solid #9c27b0;
            border-radius: 15px;
        }

        .positionLButton {
            top: -60px;
            left: 30%; 
            transform: translateX(-50%);
            position: absolute; 
            width: 60px;
            height: 60px;
            border: 3px solid #9c27b0;
            border-radius: 15px;
        }

        img.positionAButton:hover,
        img.positionBButton:hover,
        img.positionCButton:hover,
        img.positionDButton:hover,
        img.positionEButton:hover,
        img.positionFButton:hover,
        img.positionGButton:hover,
        img.positionHButton:hover,
        img.positionIButton:hover,
        img.positionJButton:hover,
        img.positionKButton:hover,
        img.positionLButton:hover {
            filter: brightness(0.7); 
            cursor: pointer; 
        }

        img.selected {
            border: 4px solid #ff5722;
            filter: brightness(0.5);
        }

    </style>
</head>
<body>
    <div class="reefcontainer">
        <img class="reef" src="images/reef.jpg" alt="Reef Image">
        
        <img class="positionAButton" src="images/coral.jpg" onclick="updateNetworkTables('positionA')" alt="Coral A">
        <img class="positionBButton" src="images/coral.jpg" onclick="updateNetworkTables('positionB')" alt="Coral B">
        <img class="positionCButton" src="images/coral.jpg" onclick="updateNetworkTables('positionC')" alt="Coral C">
        <img class="positionDButton" src="images/coral.jpg" onclick="updateNetworkTables('positionD')" alt="Coral D">
        <img class="positionEButton" src="images/coral.jpg" onclick="updateNetworkTables('positionE')" alt="Coral E">
        <img class="positionFButton" src="images/coral.jpg" onclick="updateNetworkTables('positionF')" alt="Coral F">
        <img class="positionGButton" src="images/coral.jpg" onclick="updateNetworkTables('positionG')" alt="Coral G">
        <img class="positionHButton" src="images/coral.jpg" onclick="updateNetworkTables('positionH')" alt="Coral H">
        <img class="positionIButton" src="images/coral.jpg" onclick="updateNetworkTables('positionI')" alt="Coral I">
        <img class="positionJButton" src="images/coral.jpg" onclick="updateNetworkTables('positionJ')" alt="Coral J">
        <img class="positionKButton" src="images/coral.jpg" onclick="updateNetworkTables('positionK')" alt="Coral K">
        <img class="positionLButton" src="images/coral.jpg" onclick="updateNetworkTables('positionL')" alt="Coral L">
    </div>
    <div class="sourcecontainer">
        <img class="source" src="images/source.jpg" alt="Source Image">
    </div>
    <script>
        function updateNetworkTables(valueToPost) {
            const buttons = document.querySelectorAll(".reefcontainer img");
            buttons.forEach(button => button.classList.remove("selected"));
    
            const clickedButton = document.querySelector(`img[onclick*="${valueToPost}"]`);
            if (clickedButton) {
                clickedButton.classList.add("selected");
            }
    
            fetch("/toggle", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ value: valueToPost }) 
            })
            .then(response => {
                if (response.ok) {
                    console.log(`NetworkTables value updated to ${valueToPost}!`);
                } else {
                    console.error("Failed to update NetworkTables value.");
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>    
</body>
</html>
